<header class="site-bar">
  <div class="container bar-content">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.first_name }} {{ site.last_name }}</a>
    <nav class="section-nav" aria-label="Main navigation">
      <a href="{{ '/#writing' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/#talks' | relative_url }}">Talks</a>
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
    </nav>
    {% if site.enable_darkmode %}
    <button id="light-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">
      <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
    {% endif %}
  </div>
</header>
